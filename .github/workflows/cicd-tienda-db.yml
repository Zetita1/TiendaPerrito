name: CI/CD Tienda Perritos - DB

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "db/**"

jobs:
  build-push-deploy-db:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Login en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build y push imagen DB a Docker Hub
      run: |
        cd db
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/tienda-db:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/tienda-db:latest

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Desplegar DB vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_DB_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy tienda-db desde Docker Hub" \
          --parameters '{"commands":[
            "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tienda-db:latest",
            "docker stop tienda-db || true",
            "docker rm tienda-db || true",
            "docker run -d --name tienda-db -p 3306:3306 -v dbdata:/var/lib/mysql ${{ secrets.DOCKERHUB_USERNAME }}/tienda-db:latest"
          ]}' \
          --output text